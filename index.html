<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美月</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f3f7;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #9c6b9f;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 14px;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .mizuki {
      background: white;
      margin-right: auto;
    }

    .user {
      background: #ead8ec;
      margin-left: auto;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      background: #9c6b9f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

<header>
  白石美月 🌙
</header>

<div id="chat">
  <div class="message mizuki">
    おかえりなさい😊
  </div>
</div>

<div id="inputArea">
  <input
    id="messageInput"
    type="text"
    placeholder="美月に話しかける..."
  >

  <button id="sendButton" onclick="sendMessage()">
    送信
  </button>
</div>

<script>

  // ========================================
  // Apps Script Backend
  // ========================================

  const backendUrl =
    "https://script.google.com/macros/s/AKfycbzThtmNC1EuLZcrDEu-1OLSewHs9Wn79LxPlhvySjX33xshI9mQz-LN-Mp2qmfFJXps/exec";


  // ========================================
  // 美月との現在の会話ID
  // ========================================

  let previousInteractionId = null;


  // ========================================
  // メッセージを画面に追加
  // ========================================

  function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
  }


  // ========================================
  // 美月にメッセージを送る
  // ========================================

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const text =
      input.value.trim();


    if (!text) {
      return;
    }


    // ユーザーのメッセージを表示

    addMessage(text, "user");

    input.value = "";

    button.disabled = true;


    // 美月の考え中表示

    const thinkingMessage =
      addMessage("考えてるよ…🌙", "mizuki");


    try {

      const requestBody = {
        message: text
      };


      // 2回目以降は前回のInteraction IDを送る

      if (previousInteractionId) {

        requestBody.previousInteractionId =
          previousInteractionId;

      }


      const response =
        await fetch(
          backendUrl,
          {
            method: "POST",

            headers: {
              "Content-Type": "text/plain"
            },

            body: JSON.stringify(requestBody)
          }
        );


      if (!response.ok) {
        throw new Error(
          "HTTP error: " + response.status
        );
      }


      const data =
        await response.json();


      console.log("美月からの返答:", data);


      // ========================================
      // 新しいInteraction IDを保存
      // ========================================

      if (data.interactionId) {

        previousInteractionId =
          data.interactionId;

      }


      // ========================================
      // 返答を表示
      // ========================================

      const reply =
        data.reply ||
        "ごめんね、うまく返事できなかったみたい。";


      thinkingMessage.textContent =
        reply;


    } catch (error) {

      console.error(
        "通信エラー:",
        error
      );


      thinkingMessage.textContent =
        "ごめんね、今ちょっと接続できないみたい。";


    } finally {

      button.disabled = false;

      input.focus();

    }

  }


  // ========================================
  // Enterキーで送信
  // ========================================

  document
    .getElementById("messageInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

</script>

</body>
</html>
