<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美月</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f7f3f7;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #9c6b9f;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 14px;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .mizuki {
      background: white;
      margin-right: auto;
    }

    .user {
      background: #ead8ec;
      margin-left: auto;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      background: #9c6b9f;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  白石美月 🌙
</header>

<div id="chat">
  <div class="message mizuki">
    おかえりなさい😊
  </div>
</div>

<div id="inputArea">
  <input
    id="messageInput"
    type="text"
    placeholder="美月に話しかける..."
  >
  <button onclick="sendMessage()">送信</button>
</div>

<script>
  function addMessage(text, type) {
    const chat = document.getElementById("chat");

    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
  }

 function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const backendUrl = "https://script.google.com/macros/s/AKfycbzThtmNC1EuLZcrDEu-1OLSewHs9Wn79LxPlhvySjX33xshI9mQz-LN-Mp2qmfFJXps/exec";

  addMessage("考えてるよ…🌙", "mizuki");

  fetch(backendUrl, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain"
    },
    body: JSON.stringify({
      message: text
    })
  })
  .then(response => response.json())
  .then(data => {
    const messages = document.querySelectorAll(".mizuki");
    const lastMessage = messages[messages.length - 1];

    if (lastMessage.textContent === "考えてるよ…🌙") {
      lastMessage.textContent = data.reply || "ごめんね、うまく返事できなかったみたい。";
    } else {
      addMessage(
        data.reply || "ごめんね、うまく返事できなかったみたい。",
        "mizuki"
      );
    }
  })
  .catch(error => {
    console.error(error);

    const messages = document.querySelectorAll(".mizuki");
    const lastMessage = messages[messages.length - 1];

    if (lastMessage.textContent === "考えてるよ…🌙") {
      lastMessage.textContent =
        "ごめんね、今ちょっと接続できないみたい。";
    }
  });
}

  document.getElementById("messageInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
